name: Deploy Keys

# Manual runs exist so a Vercel env var change can be shipped without a code
# change: `vercel pull` re-fetches the project's env on every run, and the
# NEXT_PUBLIC_* values are inlined by `vercel build`. They only ever redeploy
# main — see the ref guard below.
on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: deploy-keys-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: release
    steps:
      # The dispatch ref picker offers any branch or tag holding this file, and
      # every step below deploys straight to production. Fail loudly rather than
      # skipping the job, which would report the run as green. Unscoped because
      # the workflow_call path only ever fires from a push to main.
      - name: Refuse non-main refs
        if: github.ref_name != 'main'
        run: |
          echo "::error::Deploy Keys only runs against main (got ${{ github.ref_name }})"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bunx nx run-many -t build --projects=@jaw.id/core,@jaw.id/wagmi,@jaw.id/ui

      - name: Pull Vercel environment
        run: bunx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_KEYS }}

      - name: Build for Vercel
        run: bunx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_KEYS }}

      - name: Deploy to Vercel
        run: bunx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_KEYS }}
