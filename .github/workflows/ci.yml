name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:

permissions:
  actions: read
  contents: read

# A newer push to a PR cancels its older run. Every other run, including the
# call from release-and-deploy.yml on main, gets a group of its own.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: ci
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 22 resolves to the latest 22.x; check.mjs in published-e2e needs >= 22.13.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: tools/ci/tracked-ignored.sh

      - name: Check code formatting
        run: bunx prettier --check .

      # tools/ is not an nx project, so nx affected never runs this.
      - name: Test the bridge probe's pairs
        run: bun test ./tools/bridge-table

      - uses: nrwl/nx-set-shas@v4

      # e2e is published-e2e: the SDK packages installed from a local registry.
      - run: bunx nx affected -t lint test typecheck build api-check e2e
