name: E2E

# Real-browser suites for the SDK and the keys app together, driven through
# the playground. See e2e/README.md.
#
# connect-flows runs on every PR that touches the keys app, the SDK packages
# or the suites: Chromium only (the passkey is a CDP virtual authenticator),
# over http against production builds, with the network the apps call mocked.
#
# The embedded iframe needs https and all three engines, so it has its own
# workflow with a narrower trigger: e2e-iframe.yml.

on:
  pull_request:
    paths:
      - 'apps/keys-jaw-id/**'
      - 'packages/core/**'
      - 'packages/ui/**'
      - 'packages/wagmi/**'
      - 'e2e/**'
      - 'bun.lock'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connect-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # Both apps consume the built dist of the SDK packages, not their source.
      - name: Build SDK packages
        run: bunx nx run-many -t build -p @jaw.id/core @jaw.id/wagmi @jaw.id/ui

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      # The config builds and starts both apps itself (see playwright.config.ts).
      - name: Run connect flows
        working-directory: e2e
        run: bunx playwright test --config playwright.config.ts --project chromium

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-connect-flows
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
