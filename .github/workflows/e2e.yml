name: E2E

# Real-browser suites for the SDK and the keys app together, driven through
# the playground. See e2e/README.md.
#
# connect-flows runs on every PR that touches either app, the SDK packages or
# the suites: Chromium only (the passkey is a CDP virtual authenticator), over
# http against production builds, with the network the apps call mocked.
#
# iframe (manual): the same suites over https, which is what lets the SDK use
# the embedded iframe, on chromium, firefox and webkit. Heavier (three browsers
# and dev servers), so it runs on demand from the Actions tab.

on:
  pull_request:
    paths:
      - 'apps/keys-jaw-id/**'
      - 'apps/playground/**'
      - 'packages/core/**'
      - 'packages/ui/**'
      - 'packages/wagmi/**'
      - 'e2e/**'
      - 'bun.lock'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connect-flows:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # Both apps consume the built dist of the SDK packages, not their source.
      - name: Build SDK packages
        run: bunx nx run-many -t build -p @jaw.id/core @jaw.id/wagmi @jaw.id/ui

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      # The config builds and starts both apps itself (see playwright.config.ts).
      - name: Run connect flows
        working-directory: e2e
        run: bunx playwright test --config playwright.config.ts --project chromium

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-connect-flows
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

  iframe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Build SDK packages
        run: bunx nx run-many -t build -p @jaw.id/core @jaw.id/wagmi @jaw.id/ui

      - name: Install browsers
        run: bunx playwright install --with-deps chromium firefox webkit

      # A throwaway certificate for localhost. The browsers accept it through
      # ignoreHTTPSErrors, so nothing is added to the system trust store.
      - name: Create a localhost certificate
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost' \
            -keyout "$RUNNER_TEMP/localhost-key.pem" -out "$RUNNER_TEMP/localhost.pem"

      - name: Run all suites over https
        working-directory: e2e
        env:
          JAW_E2E_HTTPS: '1'
          JAW_E2E_TLS_CERT: ${{ runner.temp }}/localhost.pem
          JAW_E2E_TLS_KEY: ${{ runner.temp }}/localhost-key.pem
        run: bunx playwright test --config playwright.config.ts

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-iframe
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
